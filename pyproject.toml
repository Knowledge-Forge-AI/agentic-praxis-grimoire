[build-system]
requires = []
build-backend = "apg_python_build_backend"
backend-path = ["libexec"]

[project]
name = "agentic-praxis-grimoire"
dynamic = ["version"]
description = "Provider-neutral skills and deterministic tooling for bounded agent engineering: context bundles, evidence, environment snapshots, hotspot analysis, and footprint records."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE", "COMMERCIAL-LICENSE.md"]
authors = [{ name = "Agentic Praxis Grimoire contributors" }]
dependencies = [
  "tomli>=2.0.1; python_version < '3.11'",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.urls]
Source = "https://github.com/Knowledge-Forge-AI/agentic-praxis-grimoire"
Documentation = "https://www.knowledge-forge.ai/agentic-praxis-grimoire/"
Issues = "https://github.com/Knowledge-Forge-AI/agentic-praxis-grimoire/issues"
Changelog = "https://github.com/Knowledge-Forge-AI/agentic-praxis-grimoire/releases"
"Commercial Licensing" = "https://www.knowledge-forge.ai"

[project.scripts]
apgr = "agentic_praxis_grimoire.__main__:main"

[tool.setuptools.dynamic]
version = { file = "src/agentic_praxis_grimoire/VERSION" }

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["agentic_praxis_grimoire*"]
namespaces = false

[tool.setuptools.package-data]
agentic_praxis_grimoire = [
  "VERSION",
  "resources/skill-metadata.json",
  "bin/apgr",
  "bin/apgr.binary-manifest.json",
]
