<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid meet" width="100%" height="100%">
  <title id="logo-title">Apex Praxis Logo and System Illustration</title>
  <desc id="logo-desc">A modern scalable brand illustration showing interconnected geometric nodes and radiant paths.</desc>
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>

  <!-- Background plane -->
  <rect width="800" height="600" fill="url(#bg-grad)" rx="16" ry="16" />

  <!-- Core emblem geometry -->
  <g id="brand-emblem" transform="translate(400, 250)">
    <circle cx="0" cy="0" r="120" fill="none" stroke="url(#brand-grad)" stroke-width="8" stroke-dasharray="16 8" />
    <path d="M -60 -40 L 0 -100 L 60 -40 L 40 60 L -40 60 Z" fill="url(#brand-grad)" opacity="0.9" />
    <circle cx="0" cy="0" r="24" fill="#ffffff" />
  </g>

  <!-- Scalable network paths -->
  <g id="network-paths" stroke="#38bdf8" stroke-width="2" opacity="0.6">
    <path d="M 150 450 C 250 350, 350 400, 400 320" fill="none" />
    <path d="M 650 450 C 550 350, 450 400, 400 320" fill="none" />
    <circle cx="150" cy="450" r="8" fill="#38bdf8" />
    <circle cx="650" cy="450" r="8" fill="#818cf8" />
  </g>

  <!-- Brand text -->
  <text x="400" y="520" font-family="system-ui, sans-serif" font-size="32" font-weight="bold" fill="#f8fafc" text-anchor="middle">
    APEX PRAXIS
  </text>
</svg>
