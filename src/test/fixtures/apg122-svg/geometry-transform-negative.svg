<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <title>Geometry Transform Syntax Negative Control</title>
  <!-- Malformed transform: matrix requires 6 arguments, got 3 -->
  <g id="malformed-matrix" transform="matrix(1, 0, 0)">
    <rect width="50" height="50" fill="#ef4444" />
  </g>

  <!-- Malformed transform: non-numeric parameter -->
  <g id="malformed-scale" transform="scale(invalid, 2)">
    <circle cx="20" cy="20" r="10" fill="#3b82f6" />
  </g>

  <!-- Malformed transform: unclosed parenthesis or dangling token -->
  <g id="unclosed-transform" transform="rotate(45 100 100 translate(10, 20)">
    <line x1="0" y1="0" x2="100" y2="100" stroke="#10b981" />
  </g>
</svg>
