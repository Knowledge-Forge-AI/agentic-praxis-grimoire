<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <title>Indirect Mutual Recursion Cycle Negative Control</title>
  <defs>
    <!-- Indirect cycle: A references B, and B references A -->
    <symbol id="sym-node-a" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="10" fill="#ef4444" />
      <use href="#sym-node-b" />
    </symbol>

    <symbol id="sym-node-b" viewBox="0 0 24 24">
      <rect width="20" height="20" fill="#f97316" />
      <use href="#sym-node-a" />
    </symbol>
  </defs>

  <use href="#sym-node-a" x="50" y="50" width="100" height="100" />
</svg>
