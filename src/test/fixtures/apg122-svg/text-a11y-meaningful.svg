<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-labelledby="chart-title chart-desc" width="100%" height="100%">
  <title id="chart-title">Quarterly Revenue Growth Chart</title>
  <desc id="chart-desc">Bar chart depicting positive financial growth across quarters Q1 through Q4, peaking at 4.2 million in Q4.</desc>

  <!-- Coordinate axes with strong contrast (WCAG 2.2 1.4.11) -->
  <line x1="80" y1="320" x2="520" y2="320" stroke="#334155" stroke-width="2" />
  <line x1="80" y1="320" x2="80" y2="60" stroke="#334155" stroke-width="2" />

  <!-- Data bars with high contrast fill -->
  <g id="bars">
    <rect x="120" y="220" width="60" height="100" fill="#0284c7" rx="4" />
    <rect x="220" y="180" width="60" height="140" fill="#0284c7" rx="4" />
    <rect x="320" y="130" width="60" height="190" fill="#0284c7" rx="4" />
    <rect x="420" y="80" width="60" height="240" fill="#0284c7" rx="4" />
  </g>

  <!-- Category labels -->
  <g id="labels" font-family="system-ui, sans-serif" font-size="14" fill="#0f172a" text-anchor="middle">
    <text x="150" y="345">Q1</text>
    <text x="250" y="345">Q2</text>
    <text x="350" y="345">Q3</text>
    <text x="450" y="345">Q4</text>
  </g>
</svg>
