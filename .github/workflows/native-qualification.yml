          "run": "set -euo pipefail\npython3 release/ci/matrix_receipts.py verify --workflow native-qualification --dir \"$RUNNER_TEMP/native-evidence\" --sha \"$COMMIT_SHA\" --statuses-json \"$MATRIX_NEEDS_RESULTS\" > \"$RUNNER_TEMP/native-evidence/matrix-aggregate.json\"\npython3 tools/ci/native_gate.py --evidence \"$RUNNER_TEMP/native-evidence\" --output \"$RUNNER_TEMP/gate-out\"\n"
        },
        {
          "name": "Retain native-release-candidate-gate-result",
          "uses": "actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f",
          "with": {
            "name": "native-release-candidate-gate-result",
            "path": "${{ runner.temp }}/gate-out/native-rc-index.json",
            "retention-days": 14,
            "if-no-files-found": "error"
          },
          "id": "upload_gate",
          "if": "${{ always() }}"
        }
      ]
    }
  }
}
