{
  "name": "Deploy project website",
  "on": {
    "push": {
      "branches": [
        "main"
      ],
      "paths": [
        "website/**",
        ".github/workflows/project-pages.yml"
      ]
    },
    "workflow_dispatch": {}
  },
  "permissions": {},
  "concurrency": {
    "group": "project-pages",
    "cancel-in-progress": false
  },
  "jobs": {
    "assemble": {
      "if": "${{ github.repository == 'Knowledge-Forge-AI/agentic-praxis-grimoire' && github.ref == 'refs/heads/main' }}",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 10,
      "permissions": {
        "contents": "read"
      },
      "steps": [
        {
          "name": "Check out exact website source",
          "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Archive only declared regular website files",
          "env": {
            "SITE_FILES": "[\"index.html\", \"404.html\", \"styles.css\", \"main.js\", \"robots.txt\", \"shiori.webp\"]"
          },
          "run": "python3 -I -B - <<'PY'\nimport io, json, os, stat, tarfile\nfrom pathlib import Path\nroot=Path('website'); names=json.loads(os.environ['SITE_FILES'])\nwith tarfile.open(Path(os.environ['RUNNER_TEMP'])/'artifact.tar','x') as archive:\n    for name in names:\n        path=root/name\n        assert path.is_file() and not path.is_symlink()\n        info=path.stat(); assert stat.S_ISREG(info.st_mode) and info.st_nlink==1 and info.st_size<=1024*1024\n        body=path.read_bytes(); assert len(body)==info.st_size\n        member=tarfile.TarInfo('./'+name);member.size=len(body);member.mode=0o644;member.uid=member.gid=member.mtime=0\n        archive.addfile(member,io.BytesIO(body))\nPY"
        },
        {
          "name": "Upload declared static site",
          "uses": "actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882",
          "with": {
            "name": "github-pages",
            "path": "${{ runner.temp }}/artifact.tar",
            "retention-days": 1,
            "if-no-files-found": "error"
          }
        }
      ]
    },
    "deploy": {
      "if": "${{ github.repository == 'Knowledge-Forge-AI/agentic-praxis-grimoire' && github.ref == 'refs/heads/main' }}",
      "needs": "assemble",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 10,
      "permissions": {
        "pages": "write",
        "id-token": "write"
      },
      "environment": {
        "name": "github-pages",
        "url": "${{ steps.deployment.outputs.page_url }}"
      },
      "steps": [
        {
          "name": "Deploy project page",
          "id": "deployment",
          "uses": "actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e"
        }
      ]
    }
  }
}
