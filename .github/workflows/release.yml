name: Publish Python distribution

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Exact published release tag to verify and publish
        required: true
        default: v0.11.0

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      actions: read
      contents: read
      id-token: write
      pull-requests: read
    steps:
      - name: Verify publication request, release identity and hosted qualification
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_REPOSITORY: Knowledge-Forge-AI/agentic-praxis-grimoire
          EXPECTED_TAG: v0.11.0
          EXPECTED_VERSION: 0.11.0
          EXPECTED_RELEASE_COMMIT: 58b80a1731e38afbdb98925777ed9479b5679d86
          EXPECTED_RELEASE_TREE: eccac857cf19cc5b845c0f582be69f4549decd77
          EXPECTED_BASE: 250ce73a3dac71a89b8efeee9b8fe6cb0420bf18
          EXPECTED_PR: "1"
          EXPECTED_PR_HEAD: a0e76457ca84d56099c9c42cfd32297809680339
          EXPECTED_CI_RUN: "35053391937"
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == "$EXPECTED_REPOSITORY" ]]

          case "$GITHUB_EVENT_NAME" in
            release)
              requested_tag=$(jq -er '.release.tag_name' "$GITHUB_EVENT_PATH")
              ;;
            workflow_dispatch)
              requested_tag=$(jq -er '.inputs.tag' "$GITHUB_EVENT_PATH")
              ;;
            *)
              echo "unsupported publication event: $GITHUB_EVENT_NAME" >&2
              exit 1
              ;;
          esac
          [[ "$requested_tag" == "$EXPECTED_TAG" ]]

          release_json=$(gh api "/repos/$EXPECTED_REPOSITORY/releases/tags/$EXPECTED_TAG")
          [[ "$(jq -r '.draft' <<<"$release_json")" == false ]]
          [[ "$(jq -r '.prerelease' <<<"$release_json")" == false ]]
          [[ "$(jq -r '.tag_name' <<<"$release_json")" == "$EXPECTED_TAG" ]]

          tag_ref=$(gh api "/repos/$EXPECTED_REPOSITORY/git/ref/tags/$EXPECTED_TAG")
          tag_sha=$(jq -er '.object.sha' <<<"$tag_ref")
          tag_type=$(jq -er '.object.type' <<<"$tag_ref")
          if [[ "$tag_type" == tag ]]; then
            release_commit=$(gh api "/repos/$EXPECTED_REPOSITORY/git/tags/$tag_sha" | jq -er '.object.sha')
          else
            [[ "$tag_type" == commit ]]
            release_commit="$tag_sha"
          fi
          [[ "$release_commit" == "$EXPECTED_RELEASE_COMMIT" ]]

          commit_json=$(gh api "/repos/$EXPECTED_REPOSITORY/commits/$release_commit")
          [[ "$(jq -er '.parents | length' <<<"$commit_json")" == 1 ]]
          [[ "$(jq -er '.parents[0].sha' <<<"$commit_json")" == "$EXPECTED_BASE" ]]
          [[ "$(jq -er '.commit.tree.sha' <<<"$commit_json")" == "$EXPECTED_RELEASE_TREE" ]]
          [[ "$(jq -r '.commit.message | split("\n")[0]' <<<"$commit_json")" == "Release v$EXPECTED_VERSION" ]]

          pr_json=$(gh api "/repos/$EXPECTED_REPOSITORY/pulls/$EXPECTED_PR")
          [[ "$(jq -er '.base.ref' <<<"$pr_json")" == main ]]
          [[ "$(jq -er '.head.ref' <<<"$pr_json")" == staging ]]
          [[ "$(jq -er '.head.sha' <<<"$pr_json")" == "$EXPECTED_PR_HEAD" ]]
          [[ "$(jq -er '.merged_at // empty' <<<"$pr_json")" != "" ]]

          run_json=$(gh api "/repos/$EXPECTED_REPOSITORY/actions/runs/$EXPECTED_CI_RUN")
          [[ "$(jq -er '.head_sha' <<<"$run_json")" == "$EXPECTED_PR_HEAD" ]]
          [[ "$(jq -er '.status' <<<"$run_json")" == completed ]]
          [[ "$(jq -er '.conclusion' <<<"$run_json")" == success ]]

          jobs=$(gh api "/repos/$EXPECTED_REPOSITORY/actions/runs/$EXPECTED_CI_RUN/jobs?per_page=100")
          required=(guard static-analysis policy unit-integration closure go package sbom-and-vulnerability "codeql (go)" "codeql (python)" "codeql (javascript-typescript)" "codeql (actions)" public-pr-gate)
          for name in "${required[@]}"; do
            jq -e --arg name "$name" '.jobs | any(.name == $name and .status == "completed" and .conclusion == "success")' <<<"$jobs" >/dev/null
          done

      - name: Download and verify exact Python release assets
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_REPOSITORY: Knowledge-Forge-AI/agentic-praxis-grimoire
          EXPECTED_TAG: v0.11.0
          EXPECTED_VERSION: 0.11.0
          EXPECTED_RELEASE_COMMIT: 58b80a1731e38afbdb98925777ed9479b5679d86
          EXPECTED_RELEASE_TREE: eccac857cf19cc5b845c0f582be69f4549decd77
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets verified-dist
          gh release download "$EXPECTED_TAG" --repo "$EXPECTED_REPOSITORY" --dir release-assets
          manifest=release-assets/apg-distribution-manifest.json
          checksums=release-assets/SHA256SUMS
          [[ -f "$manifest" && -f "$checksums" ]]
          [[ "$(jq -er '.schema_version' "$manifest")" == apg.distribution-manifest/v1 ]]
          [[ "$(jq -er '.version' "$manifest")" == "$EXPECTED_VERSION" ]]
          [[ "$(jq -er '.source_commit' "$manifest")" == "$EXPECTED_RELEASE_COMMIT" ]]
          [[ "$(jq -er '.source_tree' "$manifest")" == "$EXPECTED_RELEASE_TREE" ]]
          [[ "$(jq -er '.python.package' "$manifest")" == agentic-praxis-grimoire ]]

          mapfile -t wheels < <(jq -r '.python.wheels[].name' "$manifest")
          [[ ${#wheels[@]} -eq 3 ]]
          sdist=$(jq -er '.python.sdist.name' "$manifest")

          for i in "${!wheels[@]}"; do
            name="${wheels[$i]}"
            path="release-assets/$name"
            [[ -f "$path" ]]
            want=$(jq -er --argjson i "$i" '.python.wheels[$i].sha256' "$manifest")
            got=$(sha256sum "$path" | awk '{print $1}')
            [[ "$got" == "$want" ]]
            grep -Eq "^${got}  (python/)?${name}$" "$checksums"
            cp "$path" verified-dist/
          done

          path="release-assets/$sdist"
          [[ -f "$path" ]]
          want=$(jq -er '.python.sdist.sha256' "$manifest")
          got=$(sha256sum "$path" | awk '{print $1}')
          [[ "$got" == "$want" ]]
          grep -Eq "^${got}  (python/)?${sdist}$" "$checksums"
          cp "$path" verified-dist/
          [[ "$(find verified-dist -maxdepth 1 -type f | wc -l | tr -d ' ')" == 4 ]]

      - name: Publish verified distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          packages-dir: verified-dist
