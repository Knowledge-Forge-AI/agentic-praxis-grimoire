{
  "name": "Verify published release boundary",
  "on": {
    "release": {
      "types": [
        "published"
      ]
    }
  },
  "permissions": {},
  "jobs": {
    "verify": {
      "runs-on": "ubuntu-latest",
      "permissions": {
        "actions": "read",
        "checks": "read",
        "contents": "read",
        "pull-requests": "read"
      },
      "steps": [
        {
          "name": "Check out trusted repository",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Verify published release boundary",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
          "run": "python3 tools/ci/release_boundary.py verify-published --event \"$GITHUB_EVENT_PATH\" --output \"$RUNNER_TEMP/release-boundary\""
        }
      ]
    }
  }
}
