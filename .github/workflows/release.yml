{
  "name": "Publish Python distribution",
  "on": {
    "release": {
      "types": ["published"]
    }
  },
  "permissions": {},
  "jobs": {
    "publish": {
      "runs-on": "ubuntu-latest",
      "environment": "pypi",
      "permissions": {
        "contents": "read",
        "id-token": "write"
      },
      "steps": [
        {
          "name": "Download and verify exact GitHub Release assets",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
          "shell": "bash",
          "run": "set -euo pipefail\nexpected_repository=Knowledge-Forge-AI/agentic-praxis-grimoire\nexpected_tag=v0.8.0\nexpected_version=0.8.0\nmanifest_name=apg-distribution-manifest.json\nchecksums=SHA256SUMS\n\n[[ $GITHUB_REPOSITORY == \"$expected_repository\" ]] || exit 1\n[[ $(jq -r '.release.tag_name' \"$GITHUB_EVENT_PATH\") == \"$expected_tag\" ]] || exit 1\n[[ $(jq -r '.release.draft' \"$GITHUB_EVENT_PATH\") == false ]] || exit 1\n[[ $(jq -r '.release.prerelease' \"$GITHUB_EVENT_PATH\") == false ]] || exit 1\n\nassets_json=$(jq -c '.release.assets // []' \"$GITHUB_EVENT_PATH\")\nasset_names=()\nwhile IFS= read -r name; do [[ -n \"$name\" ]] && asset_names+=(\"$name\"); done < <(jq -r '.[].name' <<< \"$assets_json\")\n\nunique_count=$(printf '%s\\n' \"${asset_names[@]}\" | LC_ALL=C sort -u | wc -l)\n[[ ${#asset_names[@]} -eq $unique_count ]] || exit 1\n\nmanifest_id=$(jq -er --arg name \"$manifest_name\" '.[] | select(.name == $name) | .id' <<< \"$assets_json\") || exit 1\nchecksum_id=$(jq -er --arg name \"$checksums\" '.[] | select(.name == $name) | .id' <<< \"$assets_json\") || exit 1\n\nmkdir -m 700 manifests verified-dist\n\ngh api -H 'Accept: application/octet-stream' \"/repos/$GITHUB_REPOSITORY/releases/assets/$manifest_id\" > manifests/\"$manifest_name\"\nchmod 600 manifests/\"$manifest_name\"\n\ngh api -H 'Accept: application/octet-stream' \"/repos/$GITHUB_REPOSITORY/releases/assets/$checksum_id\" > manifests/\"$checksums\"\nchmod 600 manifests/\"$checksums\"\n\n[[ $(jq -r '.schema_version' manifests/\"$manifest_name\") == \"apg.distribution-manifest/v1\" ]] || exit 1\n[[ $(jq -r '.version' manifests/\"$manifest_name\") == \"$expected_version\" ]] || exit 1\n[[ $(jq -r '.python.package' manifests/\"$manifest_name\") == \"agentic-praxis-grimoire\" ]] || exit 1\n\nmanifest_sha=$(sha256sum manifests/\"$manifest_name\" | awk '{print $1}')\n[[ $(grep -Ec \"^[0-9a-f]{64}  ${manifest_name}$\" manifests/\"$checksums\" || true) -eq 1 ]] || exit 1\ngrep -Eq \"^${manifest_sha}  ${manifest_name}$\" manifests/\"$checksums\" || exit 1\n\nexpected_wheels=()\nwhile IFS= read -r w; do [[ -n \"$w\" ]] && expected_wheels+=(\"$w\"); done < <(jq -r '.python.wheels[].name' manifests/\"$manifest_name\")\nsdist=$(jq -er '.python.sdist.name' manifests/\"$manifest_name\") || exit 1\n\n[[ ${#expected_wheels[@]} -eq 3 ]] || exit 1\n[[ -n \"$sdist\" ]] || exit 1\n\nexpected_python_dist=(\"${expected_wheels[@]}\" \"$sdist\")\n\nfor name in \"${expected_python_dist[@]}\"; do\n  [[ \"$name\" != *\"-any.whl\" ]] || exit 1\ndone\n\nfor w in \"${expected_wheels[@]}\"; do\n  [[ \"$w\" == agentic_praxis_grimoire-*.whl ]] || exit 1\n  [[ \"$w\" == *\"-py3-none-\"* ]] || exit 1\ndone\n[[ \"$sdist\" == agentic_praxis_grimoire-*.tar.gz ]] || exit 1\n\nfor name in \"${asset_names[@]}\"; do\n  if [[ \"$name\" == *.whl ]] || [[ \"$name\" == agentic_praxis_grimoire* && \"$name\" == *.tar.gz ]]; then\n    matched=false\n    for expected in \"${expected_python_dist[@]}\"; do\n      if [[ \"$name\" == \"$expected\" ]]; then\n        matched=true\n        break\n      fi\n    done\n    [[ \"$matched\" == true ]] || exit 1\n  fi\ndone\n\nfor expected in \"${expected_python_dist[@]}\"; do\n  found=false\n  for name in \"${asset_names[@]}\"; do\n    if [[ \"$name\" == \"$expected\" ]]; then\n      found=true\n      break\n    fi\n  done\n  [[ \"$found\" == true ]] || exit 1\ndone\n\nfor name in \"${expected_python_dist[@]}\"; do\n  asset_id=$(jq -er --arg name \"$name\" '.[] | select(.name == $name) | .id' <<< \"$assets_json\") || exit 1\n  target=\"verified-dist/$name\"\n  gh api -H 'Accept: application/octet-stream' \"/repos/$GITHUB_REPOSITORY/releases/assets/$asset_id\" > \"$target\"\n  chmod 600 \"$target\"\ndone\n\nfor i in $(seq 0 $((${#expected_wheels[@]} - 1))); do\n  wheel_name=\"${expected_wheels[$i]}\"\n  expected_sha=$(jq -er --arg idx \"$i\" '.python.wheels[$idx | tonumber].sha256' manifests/\"$manifest_name\")\n  actual_sha=$(sha256sum \"verified-dist/$wheel_name\" | awk '{print $1}')\n  [[ \"$actual_sha\" == \"$expected_sha\" ]] || exit 1\n  [[ $(grep -Ec \"^[0-9a-f]{64}  (python/)?${wheel_name}$\" manifests/\"$checksums\" || true) -eq 1 ]] || exit 1\n  grep -Eq \"^${actual_sha}  (python/)?${wheel_name}$\" manifests/\"$checksums\" || exit 1\ndone\n\nexpected_sdist_sha=$(jq -er '.python.sdist.sha256' manifests/\"$manifest_name\")\nactual_sdist_sha=$(sha256sum \"verified-dist/$sdist\" | awk '{print $1}')\n[[ \"$actual_sdist_sha\" == \"$expected_sdist_sha\" ]] || exit 1\n[[ $(grep -Ec \"^[0-9a-f]{64}  (python/)?${sdist}$\" manifests/\"$checksums\" || true) -eq 1 ]] || exit 1\ngrep -Eq \"^${actual_sdist_sha}  (python/)?${sdist}$\" manifests/\"$checksums\" || exit 1\n\ndistributions=()\nwhile IFS= read -r path; do distributions+=(\"$path\"); done < <(find verified-dist -maxdepth 1 -type f -print | LC_ALL=C sort)\n[[ ${#distributions[@]} -eq 4 ]] || exit 1\n"
        },
        {
          "name": "Publish verified distributions to PyPI",
          "uses": "pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33",
          "with": {
            "packages-dir": "verified-dist"
          }
        }
      ]
    }
  }
}
