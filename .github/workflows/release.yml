{
  "name": "Publish Python distribution",
  "on": {
    "release": {
      "types": [
        "published"
      ]
    }
  },
  "permissions": {},
  "jobs": {
    "publish": {
      "runs-on": "ubuntu-latest",
      "environment": "pypi",
      "permissions": {
        "actions": "read",
        "checks": "read",
        "contents": "read",
        "id-token": "write",
        "pull-requests": "read"
      },
      "steps": [
        {
          "name": "Download and verify exact GitHub Release assets",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
          "shell": "bash",
          "run": "set -euo pipefail\nexpected_repository=Knowledge-Forge-AI/agentic-praxis-grimoire\nexpected_tag=v0.11.0\nexpected_version=0.11.0\nmanifest_name=apg-distribution-manifest.json\nchecksums=SHA256SUMS\n\n[[ $GITHUB_REPOSITORY == \"$expected_repository\" ]] || exit 1\n[[ $(jq -r '.release.tag_name' \"$GITHUB_EVENT_PATH\") == \"$expected_tag\" ]] || exit 1\n[[ $(jq -r '.release.draft' \"$GITHUB_EVENT_PATH\") == false ]] || exit 1\n[[ $(jq -r '.release.prerelease' \"$GITHUB_EVENT_PATH\") == false ]] || exit 1\n\nassets_json=$(jq -c '.release.assets // []' \"$GITHUB_EVENT_PATH\")\nasset_names=()\nwhile IFS= read -r name; do [[ -n \"$name\" ]] && asset_names+=(\"$name\"); done < <(jq -r '.[].name' <<< \"$assets_json\")\n\nunique_count=$(printf '%s\\n' \"${asset_names[@]}\" | LC_ALL=C sort -u | wc -l)\n[[ ${#asset_names[@]} -eq $unique_count ]] || exit 1\n\nmanifest_id=$(jq -er --arg name \"$manifest_name\" '.[] | select(.name == $name) | .id' <<< \"$assets_json\") || exit 1\nchecksum_id=$(jq -er --arg name \"$checksums\" '.[] | select(.name == $name) | .id' <<< \"$assets_json\") || exit 1\n\nmkdir -m 700 manifests verified-dist\n\ngh api -H 'Accept: application/octet-stream' \"/repos/$GITHUB_REPOSITORY/releases/assets/$manifest_id\" > manifests/\"$manifest_name\"\nchmod 600 manifests/\"$manifest_name\"\n\ngh api -H 'Accept: application/octet-stream' \"/repos/$GITHUB_REPOSITORY/releases/assets/$checksum_id\" > manifests/\"$checksums\"\nchmod 600 manifests/\"$checksums\"\n\n[[ $(jq -r '.schema_version' manifests/\"$manifest_name\") == \"apg.distribution-manifest/v1\" ]] || exit 1\n[[ $(jq -r '.version' manifests/\"$manifest_name\") == \"$expected_version\" ]] || exit 1\n[[ $(jq -r '.python.package' manifests/\"$manifest_name\") == \"agentic-praxis-grimoire\" ]] || exit 1\n\nmanifest_sha=$(sha256sum manifests/\"$manifest_name\" | awk '{print $1}')\n[[ $(grep -Ec \"^[0-9a-f]{64}  ${manifest_name}$\" manifests/\"$checksums\" || true) -eq 1 ]] || exit 1\ngrep -Eq \"^${manifest_sha}  ${manifest_name}$\" manifests/\"$checksums\" || exit 1\n\nexpected_wheels=()\nwhile IFS= read -r w; do [[ -n \"$w\" ]] && expected_wheels+=(\"$w\"); done < <(jq -r '.python.wheels[].name' manifests/\"$manifest_name\")\nsdist=$(jq -er '.python.sdist.name' manifests/\"$manifest_name\") || exit 1\n\n[[ ${#expected_wheels[@]} -eq 3 ]] || exit 1\n[[ -n \"$sdist\" ]] || exit 1\n\nexpected_python_dist=(\"${expected_wheels[@]}\" \"$sdist\")\n\nfor name in \"${expected_python_dist[@]}\"; do\n  [[ \"$name\" != *\"-any.whl\" ]] || exit 1\ndone\n\nfor w in \"${expected_wheels[@]}\"; do\n  [[ \"$w\" == agentic_praxis_grimoire-*.whl ]] || exit 1\n  [[ \"$w\" == *\"-py3-none-\"* ]] || exit 1\ndone\n[[ \"$sdist\" == agentic_praxis_grimoire-*.tar.gz ]] || exit 1\n\nfor name in \"${asset_names[@]}\"; do\n  if [[ \"$name\" == *.whl ]] || [[ \"$name\" == agentic_praxis_grimoire* && \"$name\" == *.tar.gz ]]; then\n    matched=false\n    for expected in \"${expected_python_dist[@]}\"; do\n      if [[ \"$name\" == \"$expected\" ]]; then\n        matched=true\n        break\n      fi\n    done\n    [[ \"$matched\" == true ]] || exit 1\n  fi\ndone\n\nfor expected in \"${expected_python_dist[@]}\"; do\n  found=false\n  for name in \"${asset_names[@]}\"; do\n    if [[ \"$name\" == \"$expected\" ]]; then\n      found=true\n      break\n    fi\n  done\n  [[ \"$found\" == true ]] || exit 1\ndone\n\nfor name in \"${expected_python_dist[@]}\"; do\n  asset_id=$(jq -er --arg name \"$name\" '.[] | select(.name == $name) | .id' <<< \"$assets_json\") || exit 1\n  target=\"verified-dist/$name\"\n  gh api -H 'Accept: application/octet-stream' \"/repos/$GITHUB_REPOSITORY/releases/assets/$asset_id\" > \"$target\"\n  chmod 600 \"$target\"\ndone\n\nfor i in $(seq 0 $((${#expected_wheels[@]} - 1))); do\n  wheel_name=\"${expected_wheels[$i]}\"\n  expected_sha=$(jq -er --arg idx \"$i\" '.python.wheels[$idx | tonumber].sha256' manifests/\"$manifest_name\")\n  actual_sha=$(sha256sum \"verified-dist/$wheel_name\" | awk '{print $1}')\n  [[ \"$actual_sha\" == \"$expected_sha\" ]] || exit 1\n  [[ $(grep -Ec \"^[0-9a-f]{64}  (python/)?${wheel_name}$\" manifests/\"$checksums\" || true) -eq 1 ]] || exit 1\n  grep -Eq \"^${actual_sha}  (python/)?${wheel_name}$\" manifests/\"$checksums\" || exit 1\ndone\n\nexpected_sdist_sha=$(jq -er '.python.sdist.sha256' manifests/\"$manifest_name\")\nactual_sdist_sha=$(sha256sum \"verified-dist/$sdist\" | awk '{print $1}')\n[[ \"$actual_sdist_sha\" == \"$expected_sdist_sha\" ]] || exit 1\n[[ $(grep -Ec \"^[0-9a-f]{64}  (python/)?${sdist}$\" manifests/\"$checksums\" || true) -eq 1 ]] || exit 1\ngrep -Eq \"^${actual_sdist_sha}  (python/)?${sdist}$\" manifests/\"$checksums\" || exit 1\n\ndistributions=()\nwhile IFS= read -r path; do distributions+=(\"$path\"); done < <(find verified-dist -maxdepth 1 -type f -print | LC_ALL=C sort)\n[[ ${#distributions[@]} -eq 4 ]] || exit 1\n"
        },
        {
          "name": "Verify merged source, PR approval, and workflow checks",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
          "shell": "bash",
          "run": "set -euo pipefail\nexpected_repository=Knowledge-Forge-AI/agentic-praxis-grimoire\nexpected_tag=v0.11.0\nexpected_version=0.11.0\nmanifest=manifests/apg-distribution-manifest.json\napi_accept='Accept: application/vnd.github+json'\n[[ $GITHUB_REPOSITORY == \"$expected_repository\" ]] || exit 1\n[[ $(jq -r '.release.tag_name' \"$GITHUB_EVENT_PATH\") == \"$expected_tag\" ]] || exit 1\ntag_ref=$(gh api -H \"$api_accept\" \"/repos/$GITHUB_REPOSITORY/git/ref/tags/$expected_tag\")\ntag_object=$(jq -er '.object.sha' <<< \"$tag_ref\")\ntag_type=$(jq -er '.object.type' <<< \"$tag_ref\")\nif [[ \"$tag_type\" == tag ]]; then merged_commit=$(gh api -H \"$api_accept\" \"/repos/$GITHUB_REPOSITORY/git/tags/$tag_object\" | jq -er '.object.sha'); else [[ \"$tag_type\" == commit ]] || exit 1; merged_commit=\"$tag_object\"; fi\nmerged_commit_json=$(gh api -H \"$api_accept\" \"/repos/$GITHUB_REPOSITORY/commits/$merged_commit\")\n[[ $(jq -er '.parents | length' <<< \"$merged_commit_json\") == 1 ]] || exit 1\nmerged_parent=$(jq -er '.parents[0].sha' <<< \"$merged_commit_json\")\nmerged_tree=$(jq -er '.commit.tree.sha' <<< \"$merged_commit_json\")\n[[ \"$merged_tree\" =~ ^[0-9a-f]{40}$ ]] || exit 1\n[[ $(jq -r '.commit.message | split(\"\\n\")[0]' <<< \"$merged_commit_json\") == \"Release v$expected_version\" ]] || exit 1\naccepted_ref=$(gh api -H \"$api_accept\" \"/repos/$GITHUB_REPOSITORY/git/ref/tags/v0.10.0\")\naccepted_object=$(jq -er '.object.sha' <<< \"$accepted_ref\")\naccepted_type=$(jq -er '.object.type' <<< \"$accepted_ref\")\nif [[ \"$accepted_type\" == tag ]]; then accepted_base=$(gh api -H \"$api_accept\" \"/repos/$GITHUB_REPOSITORY/git/tags/$accepted_object\" | jq -er '.object.sha'); else [[ \"$accepted_type\" == commit ]] || exit 1; accepted_base=\"$accepted_object\"; fi\n[[ \"$merged_parent\" == \"$accepted_base\" ]] || exit 1\nmerged_prs=$(gh api -H \"$api_accept\" \"/repos/$GITHUB_REPOSITORY/commits/$merged_commit/pulls\")\npr_count=$(jq --arg repo \"$GITHUB_REPOSITORY\" --arg commit \"$merged_commit\" '[.[] | select(.base.ref == \"main\" and .head.ref == \"staging\" and .head.repo.full_name == $repo and .merged_at != null and .merge_commit_sha == $commit)] | length' <<< \"$merged_prs\")\n[[ \"$pr_count\" == 1 ]] || exit 1\npr_number=$(jq -er --arg repo \"$GITHUB_REPOSITORY\" --arg commit \"$merged_commit\" '[.[] | select(.base.ref == \"main\" and .head.ref == \"staging\" and .head.repo.full_name == $repo and .merged_at != null and .merge_commit_sha == $commit)][0].number' <<< \"$merged_prs\")\npr_details=$(gh api -H \"$api_accept\" \"/repos/$GITHUB_REPOSITORY/pulls/$pr_number\")\n[[ $(jq -r '.base.ref' <<< \"$pr_details\") == main ]] || exit 1\n[[ $(jq -r '.head.ref' <<< \"$pr_details\") == staging ]] || exit 1\n[[ $(jq -r '.head.repo.full_name' <<< \"$pr_details\") == \"$GITHUB_REPOSITORY\" ]] || exit 1\n[[ $(jq -r '.merged_at // empty' <<< \"$pr_details\") != \"\" ]] || exit 1\n[[ $(jq -r '.merge_commit_sha' <<< \"$pr_details\") == \"$merged_commit\" ]] || exit 1\npr_head_sha=$(jq -er '.head.sha' <<< \"$pr_details\")\n[[ \"$pr_head_sha\" =~ ^[0-9a-f]{40}$ ]] || exit 1\npr_reviews=$(gh api --paginate --slurp -H \"$api_accept\" \"/repos/$GITHUB_REPOSITORY/pulls/$pr_number/reviews\")\napproved_reviews=$(jq -r --arg head \"$pr_head_sha\" '\n  (add // [])\n  | map(select((.user.login // \"\") != \"\"))\n  | group_by(.user.login)\n  | map(sort_by(.id) | last)\n  | map(select(.state == \"APPROVED\" and .commit_id == $head))\n  | length\n' <<< \"$pr_reviews\")\n[[ \"$approved_reviews\" =~ ^[1-9][0-9]*$ ]] || { echo \"no current approved review is bound to the merged PR head\" >&2; exit 1; }\nworkflow_path=.github/workflows/public-pr.yml\nworkflow_runs=$(gh api --paginate --slurp -H \"$api_accept\" \"/repos/$GITHUB_REPOSITORY/actions/runs?event=pull_request&branch=staging&per_page=100\")\nworkflow_run=$(jq -er --arg path \"$workflow_path\" --arg repo \"$GITHUB_REPOSITORY\" --arg number \"$pr_number\" --arg head \"$pr_head_sha\" '\n  (map(.workflow_runs // []) | add // [])\n  | map(select(\n      .path == $path and\n      .event == \"pull_request\" and\n      .head_branch == \"staging\" and\n      .head_repository.full_name == $repo and\n      .head_sha == $head and\n      (.pull_requests // [] | any(.number == ($number | tonumber))) and\n      .status == \"completed\" and\n      .conclusion == \"success\"\n    ))\n  | sort_by(.updated_at // \"\")\n  | last\n' <<< \"$workflow_runs\")\nrun_id=$(jq -er '.id' <<< \"$workflow_run\")\nrun_head_sha=$(jq -er '.head_sha' <<< \"$workflow_run\")\n[[ \"$run_id\" =~ ^[0-9]+$ ]] || exit 1\n[[ \"$run_head_sha\" =~ ^[0-9a-f]{40}$ ]] || exit 1\n[[ \"$run_head_sha\" == \"$pr_head_sha\" ]] || { echo \"selected PR workflow run is not bound to the merged PR head\" >&2; exit 1; }\nrun_jobs=$(gh api --paginate --slurp -H \"$api_accept\" \"/repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100\")\nrequired_checks=(guard static-analysis policy unit-integration closure go package sbom-and-vulnerability \"codeql (go)\" \"codeql (python)\" \"codeql (javascript-typescript)\" \"codeql (actions)\" public-pr-gate)\nfor required_check in \"${required_checks[@]}\"; do jq -e --arg name \"$required_check\" --arg head \"$pr_head_sha\" '\n  (map(.jobs // []) | add // [])\n  | map(select(.name == $name and .head_sha == $head and .status == \"completed\")) as $matches\n  | ($matches | length > 0) and (($matches | sort_by(.completed_at // \"\") | last | .conclusion) == \"success\")\n' <<< \"$run_jobs\" >/dev/null || { echo \"required PR job did not succeed: $required_check\" >&2; exit 1; }; done\nrequired_receipts='[\"guard\",\"static-analysis\",\"policy\",\"unit-integration\",\"closure\",\"go\",\"package\",\"sbom-and-vulnerability\",\"codeql-go\",\"codeql-python\",\"codeql-javascript-typescript\",\"codeql-actions\"]'\naggregate_artifacts=$(gh api --paginate --slurp -H \"$api_accept\" \"/repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100\")\naggregate_artifact_id=$(jq -er --arg name \"public-pr-gate-result\" --argjson expected_run \"$run_id\" --arg expected_sha \"$pr_head_sha\" '\n  (map(.artifacts // []) | add // [])\n  | map(select(\n      .name == $name and\n      .expired == false and\n      .workflow_run.id == $expected_run and\n      .workflow_run.head_sha == $expected_sha and\n      .workflow_run.head_branch == \"staging\"\n    ))\n  | if length == 1 then .[0].id else error(\"aggregate gate artifact is absent or ambiguous\") end\n' <<< \"$aggregate_artifacts\")\naggregate_artifact_size=$(jq -er --arg name \"public-pr-gate-result\" --argjson expected_run \"$run_id\" --arg expected_sha \"$pr_head_sha\" '\n  (map(.artifacts // []) | add // [])\n  | map(select(\n      .name == $name and\n      .expired == false and\n      .workflow_run.id == $expected_run and\n      .workflow_run.head_sha == $expected_sha and\n      .workflow_run.head_branch == \"staging\"\n    ))\n  | if length == 1 then .[0].size_in_bytes else error(\"aggregate gate artifact metadata is unavailable\") end\n' <<< \"$aggregate_artifacts\")\n[[ \"$aggregate_artifact_size\" =~ ^[1-9][0-9]*$ ]] || { echo \"aggregate gate artifact is empty\" >&2; exit 1; }\naggregate_root=\"$RUNNER_TEMP/aggregate-gate\"\nmkdir -m 700 \"$aggregate_root\"\naggregate_zip=\"$aggregate_root/public-pr-gate-result.zip\"\ngh api -H 'Accept: application/octet-stream' \"/repos/$GITHUB_REPOSITORY/actions/artifacts/$aggregate_artifact_id/zip\" > \"$aggregate_zip\"\n[[ -s \"$aggregate_zip\" ]] || { echo \"aggregate gate artifact download is empty\" >&2; exit 1; }\naggregate_artifact_digest=$(jq -er --arg name \"public-pr-gate-result\" --argjson expected_run \"$run_id\" --arg expected_sha \"$pr_head_sha\" '\n  (map(.artifacts // []) | add // [])\n  | map(select(\n      .name == $name and\n      .expired == false and\n      .workflow_run.id == $expected_run and\n      .workflow_run.head_sha == $expected_sha and\n      .workflow_run.head_branch == \"staging\"\n    ))\n  | if length == 1 then .[0].digest else error(\"aggregate gate artifact digest is unavailable\") end\n' <<< \"$aggregate_artifacts\")\n[[ \"$aggregate_artifact_digest\" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo \"aggregate gate artifact digest is malformed\" >&2; exit 1; }\nactual_aggregate_digest=\"sha256:$(sha256sum \"$aggregate_zip\" | awk '{print $1}')\"\n[[ \"$actual_aggregate_digest\" == \"$aggregate_artifact_digest\" ]] || {\n  echo \"aggregate gate artifact digest mismatch\" >&2\n  exit 1\n}\nmapfile -t aggregate_members < <(unzip -Z1 \"$aggregate_zip\")\n[[ ${#aggregate_members[@]} -eq 1 && \"${aggregate_members[0]}\" == \"matrix-aggregate.json\" ]] || {\n  echo \"aggregate gate artifact contents are not exact\" >&2\n  exit 1\n}\naggregate_json=\"$aggregate_root/matrix-aggregate.json\"\nunzip -p \"$aggregate_zip\" matrix-aggregate.json > \"$aggregate_json\"\njq -e --argjson expected \"$required_receipts\" --arg expected_head \"$pr_head_sha\" --arg expected_base \"$accepted_base\" '\n  .schema == \"apg-matrix-aggregate-v1\" and\n  .success == true and\n  ((.errors | type) == \"array\" and (.errors | length) == 0) and\n  .required_members_count == ($expected | length) and\n  .verified_members_count == ($expected | length) and\n  ((.members | type) == \"object\") and\n  ((.members | keys | sort) == ($expected | sort)) and\n  ([.members[] | .status] | all(. == \"success\")) and\n  ([.members[] | .sha] | all(test(\"^[0-9a-f]{40}$\"))) and\n  ([.members[] | .pr_head_sha] | all(. == $expected_head)) and\n  ([.members[] | .pr_base_sha] | all(. == $expected_base))\n' \"$aggregate_json\" >/dev/null || { echo \"aggregate gate receipt is missing, failed, or not bound to this PR run\" >&2; exit 1; }\ntested_sha=$(jq -er '\n  [.members[] | .sha] | unique\n  | if length == 1 then .[0] else error(\"aggregate receipt has inconsistent tested SHAs\") end\n' \"$aggregate_json\")\n[[ \"$tested_sha\" =~ ^[0-9a-f]{40}$ ]] || { echo \"aggregate receipt tested SHA is malformed\" >&2; exit 1; }\ntested_commit_json=$(gh api -H \"$api_accept\" \"/repos/$GITHUB_REPOSITORY/commits/$tested_sha\")\njq -e --arg expected_base \"$accepted_base\" --arg expected_head \"$pr_head_sha\" '\n  ((.parents | type) == \"array\") and\n  ((.parents | length) == 2) and\n  .parents[0].sha == $expected_base and\n  .parents[1].sha == $expected_head\n' <<< \"$tested_commit_json\" >/dev/null || {\n  echo \"aggregate gate tested candidate is not the expected base/head merge\" >&2\n  exit 1\n}\ntested_tree=$(jq -er '.commit.tree.sha' <<< \"$tested_commit_json\")\n[[ \"$tested_tree\" =~ ^[0-9a-f]{40}$ ]] || exit 1\n[[ \"$tested_tree\" == \"$merged_tree\" ]] || {\n  echo \"aggregate gate tested tree does not match the actual merged source tree\" >&2\n  exit 1\n}\nmanifest_source_commit=$(jq -er '.source_commit' \"$manifest\")\nmanifest_source_tree=$(jq -er '.source_tree' \"$manifest\")\n[[ \"$manifest_source_commit\" =~ ^[0-9a-f]{40}$ ]] || exit 1\n[[ \"$manifest_source_tree\" =~ ^[0-9a-f]{40}$ ]] || exit 1\n[[ \"$manifest_source_commit\" == \"$merged_commit\" ]] || exit 1\n[[ \"$manifest_source_tree\" == \"$merged_tree\" ]] || exit 1"
        },
        {
          "name": "Publish verified distributions to PyPI",
          "uses": "pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33",
          "with": {
            "packages-dir": "verified-dist"
          }
        }
      ]
    }
  }
}
